<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход для судьи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-5 mb-4">Вход для судьи</h2>
        <form method="post" class="mx-auto" style="max-width: 350px;">
            <input type="text" name="login" class="form-control mb-2" placeholder="Логин" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required>
            <button type="submit" class="btn btn-mir w-100">Войти</button>
            {% if error %}
            <div class="alert alert-danger mt-2">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
